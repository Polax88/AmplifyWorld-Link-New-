services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amplifyworld
      POSTGRES_PASSWORD: amplifyworld
      POSTGRES_DB: amplifyworld_link
    ports:
      - "5432:5432"
    volumes:
      - amplifyworld_postgres_data:/var/lib/postgresql/data

volumes:
  amplifyworld_postgres_data:
